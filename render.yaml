databases:
  - name: curriculum-db
    databaseName: curriculum_gap
    user: curriculum_user
    plan: free

services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: ai-curriculum-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: curriculum-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: PYTHONPATH
        value: .

  # 2. React Vite Frontend Static Site
  - type: web
    name: ai-curriculum-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-curriculum-backend
          property: host
